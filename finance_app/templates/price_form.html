{% extends "base.html" %}
{% block title %}手工净值{% endblock %}
{% block eyebrow %}VALUATION{% endblock %}
{% block heading %}为净值标明日期与来源。{% endblock %}
{% block subtitle %}这里只记录人工核实的数据，绝不标作实时价格。{% endblock %}
{% block content %}<section class="panel form-panel"><div class="section-heading"><h2>新增手工价格</h2><a class="text-link" href="/accounts">管理基金 ↗</a></div>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form class="manual-form" method="post" action="/prices">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>基金<select required name="asset_id"><option value="">请选择</option>{% for asset in assets %}<option value="{{ asset.id }}" {{ 'selected' if values.get('asset_id') == asset.id|string }}>{{ asset.code }} · {{ asset.name }}</option>{% endfor %}</select></label>
  <label>估值日期<input required type="date" max="{{ vm.today }}" name="valuation_date" value="{{ values.get('valuation_date', vm.today) }}"></label>
  <label>价格 / 净值<input required inputmode="decimal" name="price" value="{{ values.get('price', '') }}"></label>
  <label>人工依据<input maxlength="48" name="source" placeholder="user-entry / fund-statement" value="{{ values.get('source', '') }}"><span class="hint">留空使用 manual:user-entry</span></label>
  <button type="submit">保存净值</button>
</form></section>{% endblock %}
